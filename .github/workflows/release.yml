name: Release
# A tag vX.Y.Z builds both images with that version, signs the update files with the
# release key and publishes them as a GitHub release and on the web installer page.
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r .github/requirements/release.txt
      - name: Version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CAJUI_FIRMWARE_VERSION=$(python tools/package_firmware.py version-code "$VERSION")" >> "$GITHUB_ENV"
      - name: Build
        run: pio run -e runtime_tx -e runtime_rx
      - name: Package and sign
        env:
          SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          KEY="$RUNNER_TEMP/signing-key.pem"
          printf '%s\n' "$SIGNING_KEY" > "$KEY"
          BOOT_APP0="$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"
          mkdir -p dist site-out
          for pair in tx:transmitter rx:receiver; do
            ROLE="${pair%%:*}"; NAME="${pair##*:}"; BUILD=".pio/build/runtime_$ROLE"
            python tools/package_firmware.py package --image "$BUILD/firmware.bin" --role "$ROLE" \
              --version "$VERSION" --key "$KEY" --output "dist/cajui-$NAME-$VERSION.cjfw"
            python -m esptool --chip esp32s3 merge_bin -o "dist/cajui-$NAME-$VERSION-full.bin" \
              --flash_mode dio --flash_freq 80m --flash_size 8MB \
              0x0 "$BUILD/bootloader.bin" 0x8000 "$BUILD/partitions.bin" \
              0xe000 "$BOOT_APP0" 0x10000 "$BUILD/firmware.bin"
            cp "dist/cajui-$NAME-$VERSION-full.bin" site-out/
            python tools/package_firmware.py manifest --name "Cajuí $NAME" --version "$VERSION" \
              --image "cajui-$NAME-$VERSION-full.bin" --output "site-out/manifest-$NAME.json"
          done
          rm -f "$KEY"
          sed "s/{{VERSION}}/$VERSION/" site/index.html > site-out/index.html
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site-out
  pages:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
