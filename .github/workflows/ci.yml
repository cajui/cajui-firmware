name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - run: python -m pip install clang-format==19.1.7 clang-tidy==19.1.0 ruff==0.6.9
      - name: Formatting, clang-tidy and ruff
        run: python scripts/check_protocol.py --lint
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y clang llvm libssl-dev
      - run: python -m pip install platformio==6.1.18
      - name: Unit tests, sanitizers and coverage
        env:
          CC: clang
          CXX: clang++
        run: python scripts/check_protocol.py --coverage
  esp32-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.1.18
      - name: Compile tests with the ESP32 crypto backend (no upload)
        run: pio test -e protocol_esp32 --without-uploading --without-testing
      - name: Compile radio-disabled administration images
        run: pio run -e admin_tx -e admin_rx
