name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - run: python -m pip install --require-hashes -r .github/requirements/lint.txt
      - name: Install shell and workflow linters
        run: |
          curl -fsSLo actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint.tar.gz' | sha256sum -c -
          curl -fsSLo shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          echo '6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  shellcheck.tar.xz' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/check-tools"
          tar -xzf actionlint.tar.gz -C "$RUNNER_TEMP/check-tools" actionlint
          tar -xJf shellcheck.tar.xz --strip-components=1 -C "$RUNNER_TEMP/check-tools" shellcheck-v0.10.0/shellcheck
          echo "$RUNNER_TEMP/check-tools" >> "$GITHUB_PATH"
      - name: Formatting, clang-tidy and ruff
        run: python scripts/check_protocol.py --lint
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18 libssl-dev
      - run: python -m pip install --require-hashes -r .github/requirements/native.txt
      - name: Unit tests, sanitizers and coverage
        env:
          CC: clang-18
          CXX: clang++-18
          LLVM_COV: llvm-cov-18
          LLVM_PROFDATA: llvm-profdata-18
        run: python scripts/check_protocol.py --coverage
  python-minimum:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - run: python -m pip install --require-hashes -r .github/requirements/python.txt
      - run: python scripts/check_protocol.py --python-only --coverage
  esp32-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r .github/requirements/build.txt
      - name: Compile tests with the ESP32 crypto backend (no upload)
        run: pio test -e protocol_esp32 --without-uploading --without-testing
      - name: Compile experimental radio applications (no upload)
        run: pio run -e runtime_tx -e runtime_rx -e runtime_tx_stick_lite
      - run: python -m pip install --require-hashes -r .github/requirements/lint.txt
      - name: clang-tidy over src/ with the ESP32 build flags
        run: python scripts/lint_board.py
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y clang-18 libssl-dev
      - name: Fuzz frame and command parsers (libFuzzer, 60 s each)
        env:
          CXX: clang++-18
        run: bash scripts/fuzz.sh 60
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-failures
          path: .pio/fuzz/artifacts/
