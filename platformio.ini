[platformio]
default_envs = native

[env]
lib_deps = throwtheswitch/Unity@2.6.1
test_framework = unity
test_filter = test_protocol
test_build_src = no

[env:native]
platform = native@1.2.1
build_flags = -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -D UNITY_DETAIL1_NAME=\"Scenario\"
extra_scripts =
    pre:scripts/native_test_config.py
    post:scripts/native_compilers.py

; Build-only target for the shared tests; not an application image.
[env:protocol_esp32]
platform = espressif32@6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
; Same layout as the images, so running the suite on a device never moves the cajui NVS.
board_build.partitions = partitions.csv
build_flags = -Wall -Wextra -Werror -D UNITY_DETAIL1_NAME=\"Scenario\" -D UNITY_SUPPORT_64

; Radio applications. Each image also has a USB administration mode: a device without
; enrollment, or asked with CJ1 ADMIN, boots with the radio held in reset.
[env:runtime_tx]
platform = espressif32@6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
board_build.partitions = partitions.csv
build_flags = -DCAJUI_RUNTIME_ROLE=1 -Wall -Wextra -Werror
extra_scripts = pre:scripts/firmware_version.py
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@7.1.2
    adafruit/DHT sensor library@1.4.6
    adafruit/Adafruit Unified Sensor@1.1.15

[env:runtime_rx]
extends = env:runtime_tx
build_flags = -DCAJUI_RUNTIME_ROLE=2 -Wall -Wextra -Werror
lib_deps =
    ${env:runtime_tx.lib_deps}
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@4.6.2
