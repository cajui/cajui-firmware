[platformio]
default_envs = native

[env]
lib_deps = throwtheswitch/Unity@2.6.1
test_framework = unity
test_filter = test_protocol
test_build_src = no

[env:native]
platform = native@1.2.1
build_flags = -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer
extra_scripts =
    pre:scripts/native_test_config.py
    post:scripts/native_compilers.py

; Build-only target for the shared tests; not an application image.
[env:protocol_esp32]
platform = espressif32@6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
build_flags = -Wall -Wextra -Werror
